<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Opening app…</title>
		<style>
			body {
				margin: 16px;
			}

			#campaign-id-form {
				display: flex;
				flex-direction: column;
				gap: 12px;
				max-width: 480px;
				margin-bottom: 24px;
			}

			#campaign-id-form label {
				font-size: 18px;
			}

			#campaign-id,
			#campaign-id-form button {
				box-sizing: border-box;
				width: 100%;
				padding: 12px 16px;
				border: 1px solid #aaa;
				border-radius: 6px;
			}

			#campaign-id {
				min-height: 56px;
				font-size: 20px;
			}

			#campaign-id-form button {
				min-height: 48px;
				font-size: 18px;
				cursor: pointer;
			}

			h1 {
				overflow-wrap: anywhere;
			}
		</style>
	</head>
	<body>
		<form id="campaign-id-form">
			<label for="campaign-id">af_c_id：</label>
			<input type="text" id="campaign-id" name="af_c_id">
			<button type="submit">保存</button>
		</form>

		<h1><a href="https://583web.onelink.me/W2os?af_xp=custom&pid=test_coupon_campaign&c=ceshi&af_c_id=111111111&af_dp=dineroalvuelo%3A%2F%2Fspeedballpoint&af_sub5=isTest583&af_android_url=https%3A%2F%2Fw59972932-jpg.github.io%2Ftest%2F583.apk">appsflyer>>>>>campaign测试</a></h1>
		<h1><a href="https://583web.onelink.me/W2os?af_xp=custom&pid=Test_coupon&af_dp=dineroalvuelo%3A%2F%2Fspeedballpoint&deep_link_value=advertising_client">appsflyer>>>>>拉新 300</a></h1>
		<h1><a href="https://583web.onelink.me/W2os?af_xp=custom&pid=Test_coupon&af_dp=dineroalvuelo%3A%2F%2Fspeedballpoint&deep_link_value=user_re_engagement">appsflyer>>>>>召回 300</a></h1>
		<script>
			const campaignLink = document.querySelector('h1 a');
			const campaignIdInput = document.getElementById('campaign-id');
			campaignIdInput.value = new URL(campaignLink.href).searchParams.get('af_c_id') || '';

			document.getElementById('campaign-id-form').addEventListener('submit', function (event) {
				event.preventDefault();
				const url = new URL(campaignLink.href);
				url.searchParams.set('af_c_id', campaignIdInput.value);
				campaignLink.href = url.toString();
			});
		</script>
	</body>
</html>
